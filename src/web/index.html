<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>LUMEN</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27%23cfe3ff%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23fff%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="score"><span id="light">0</span></div>
      <div class="meta"><span id="score">score 0</span> · <span id="turn">turn 0</span> · <span id="orbs">0 orbs</span> · seed <span id="seed">0</span></div>
      <div class="meta" id="level"></div>
      <div class="meta" id="rivals"></div>
      <div class="meta keys">R new universe · [ ] change level · T tuning</div>
    </div>
    <div id="hint">collect the light</div>
    <aside id="panel" class="hidden">
      <header>
        <strong>tuning</strong>
        <button id="toggle" title="hide panel (T)">×</button>
      </header>
      <div id="sliders"></div>
      <div class="row">
        <button id="newboard">new board (R)</button>
        <button id="replay" title="same seed">replay seed</button>
      </div>
      <div class="row">
        <label><input type="checkbox" id="selfpreview" checked /> show my move</label>
        <label><input type="checkbox" id="preview" /> + opponent reply (cheat)</label>
        <label><input type="checkbox" id="springs" checked /> springs</label>
        <label><input type="checkbox" id="ladder" checked /> ladder</label>
      </div>
      <div class="row">
        <button id="copy">copy config</button>
        <button id="reset">reset defaults</button>
      </div>
      <pre id="log"></pre>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
