<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>LUMEN</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2711%27 fill=%27%23fabd2f%27/%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%275%27 fill=%27%23ebdbb2%27/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
    <style>
      #game { cursor: none; }
      #glow { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; mix-blend-mode: screen; }
      #glow.off { display: none; }
      #hud .rank { display: flex; gap: 14px; align-items: baseline; margin-top: 4px; font-size: 12px; color: var(--dim); letter-spacing: 0.08em; }
      #hud .rank b { font-weight: 400; }
      #hud .rank i { font-style: normal; opacity: 0.55; font-size: 10px; margin-left: 3px; }
      #hud .clock { font-variant-numeric: tabular-nums; color: var(--ink); }
      #hud .clock.late { color: #fb4934; }
      #end .sub a { color: var(--ink); pointer-events: auto; }
      #end .best { margin-top: 6px; font-size: 12px; letter-spacing: 0.25em; color: var(--dim); }
      #end .best.new { color: #fabd2f; }
      #end { position: fixed; inset: 0; display: none; place-items: center; text-align: center; pointer-events: none; }
      #end.on { display: grid; }
      #end .title { font-size: 34px; font-weight: 300; letter-spacing: 0.3em; text-shadow: 0 0 24px rgba(250, 189, 47, 0.45); }
      #end .sub { margin-top: 10px; font-size: 13px; letter-spacing: 0.25em; color: var(--dim); }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <canvas id="glow"></canvas>
    <div id="tools">
      <button id="sound" title="sound (M)" aria-label="toggle sound">♪</button>
      <button id="newsky" title="new sky (R)" aria-label="new sky">↻</button>
    </div>
    <div id="hud">
      <div class="score"><span id="light">0</span></div>
      <div class="rank" id="rank"></div>
      <div class="meta"><span id="clock" class="clock"></span> <span id="level"></span></div>
      <div class="meta keys">tap where to go · hold to burn hard · tap food to chase · tap a giant to orbit · shift-tap to queue · space = drift · R new sky · D daily sky · [ ] rivals · M sound · T tuning</div>
    </div>
    <div id="bark"></div>
    <div id="hint">tap where you want to go · hold to burn hard · blue is food · red absorbs you</div>
    <div id="end"><div><div class="title" id="endtitle"></div><div class="sub" id="endsub"></div><div class="best" id="endbest"></div></div></div>
    <aside id="panel" class="hidden">
      <header>
        <strong>tuning</strong>
        <button id="toggle" title="hide panel (T)">×</button>
      </header>
      <div class="slider" id="melumens">
        <span class="name">my lumens</span><span class="val" id="meval"></span>
        <input type="range" id="meslider" min="1" max="400" step="1" />
      </div>
      <div id="sliders"></div>
      <div class="row">
        <button id="newboard">new game (R)</button>
        <button id="replay" title="same seed">replay seed</button>
      </div>
      <div class="row">
        <label><input type="checkbox" id="showpath" checked /> my path</label>
        <label><input type="checkbox" id="showall" /> all paths</label>
        <label><input type="checkbox" id="manual" /> manual burns</label>
        <label><input type="checkbox" id="bloom" checked /> bloom</label>
      </div>
      <div class="row">
        <button id="copy">copy config</button>
        <button id="reset">reset defaults</button>
      </div>
      <pre id="log"></pre>
    </aside>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
